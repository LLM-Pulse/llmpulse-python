# Started life as the OpenAPI Generator's default workflow, which ran
# `pytest --cov=llmpulse`. We generate no tests (apiTests=false,
# modelTests=false), so pytest exited 5, "no tests collected", and this job had
# failed on every run since the repository was created. The version matrix is
# the part worth keeping: it is the only check that the generated client
# actually installs and imports on every Python we claim to support.

name: llmpulse Python package

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the client
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Import every generated module
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import llmpulse

          print(f"llmpulse {llmpulse.__version__} on {sys.version}")
          failed = []
          for module in pkgutil.walk_packages(llmpulse.__path__, "llmpulse."):
              try:
                  importlib.import_module(module.name)
              except Exception as error:  # noqa: BLE001 - report every module, not the first
                  failed.append(f"{module.name}: {error!r}")
          if failed:
              raise SystemExit("modules failed to import:\n  " + "\n  ".join(failed))
          print("every module imported")
          PY
